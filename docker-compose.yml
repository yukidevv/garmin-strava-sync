services:
  sync:
    build: .
    env_file: .env
    environment:
      GARMIN_TOKEN_DIR: /data/.garminconnect
    volumes:
      - garmin_token:/data
    restart: unless-stopped
    # 認証なしの内部エンドポイントなのでホスト内(localhost)限定で公開。
    # スケジューリングはホストのsystemd timerが /sync を叩く（systemd/ 参照）。
    ports:
      - "127.0.0.1:8787:8000"

volumes:
  garmin_token:
